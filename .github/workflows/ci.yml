name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Build firmware (ESP-IDF 5.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: deskhub-firmware
          path: |
            firmware/build/deskhub.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin

  companion:
    name: Companion tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python tests/run_all.py
