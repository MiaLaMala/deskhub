; Desk Hub CYD: Firmware fuer das ESP32-2432S028R ("Cheap Yellow Display").
;
; Plattform, Board und Partitionstabelle muessen genau so bleiben: Bootloader und
; Partitionstabelle auf dem Geraet stammen von diesem Stand, ein anderes Layout
; liesse sich nicht ueber WLAN einspielen (App-Slot 1.966.080 Bytes).

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 460800

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	; Nicht mehr in der PlatformIO-Registry, daher direkt aus Git.
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	lvgl/lvgl@9.2.2

; Die UI-Dateien liegen in ui/ und werden auch von der Vorschau (../preview) gebaut.
build_src_filter = +<*> +<../ui/>

build_flags =
	-Os
	-I include
	-I ui
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LV_LVGL_H_INCLUDE_SIMPLE=1
	; TFT_eSPI per Compilerschalter, nicht per Datei in .pio/libdeps.
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	; Panel an HSPI, der Touch hat einen eigenen Bus.
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT=1
